<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classifieds Platform - Craigslist Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #2c3e50;
    }
    
    #app {
      min-height: 100vh;
      width: 100%;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 1.2rem;
      color: #3498db;
      background: #f5f5f5;
    }

    .error {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e74c3c;
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app" class="loading">Loading Craigslist Clone...</div>
  <script>
    window.addEventListener('error', function(e) {
      console.error('Script error:', e);
      document.getElementById('app').innerHTML = '<div class="error">Error loading app. Check browser console (F12).</div>';
    });
  </script>
  <script src="/bundle.js"></script>
</body>
</html>
